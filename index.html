<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Nebula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
      
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050510; /* Deep space black */
      }

      /* Photo overlay animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes scaleIn {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @keyframes modalBackdropIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes modalCardIn {
        from { transform: scale(0.9) translateY(20px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }

      @keyframes modalCardOut {
        from { transform: scale(1) translateY(0); opacity: 1; }
        to { transform: scale(0.9) translateY(20px); opacity: 0; }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      .animate-scale-in {
        animation: scaleIn 0.4s ease-out;
      }

      .animate-modal-backdrop {
        animation: modalBackdropIn 0.25s ease-out;
      }

      .animate-modal-card-in {
        animation: modalCardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .animate-modal-card-out {
        animation: modalCardOut 0.2s ease-in forwards;
      }
    </style>
